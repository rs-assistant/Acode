import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// Read-only inventory of the selected runtime graph, not plugin declarations or
// Gradle's buildscript dependencies. Run as an init script on the Android build.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) throw new GradleException('Android app project is missing')
    app.tasks.register('acodeAuditRuntimeDependencies') {
        doLast {
            def configuration = app.configurations.getByName('debugRuntimeClasspath')
            def modules = configuration.incoming.resolutionResult.allComponents
                .collect { it.id }
                .findAll { it instanceof ModuleComponentIdentifier }
                .collect { [group: it.group, name: it.module, version: it.version] }
                .sort { a, b -> "${a.group}:${a.name}:${a.version}" <=> "${b.group}:${b.name}:${b.version}" }
            println('ACODE_RUNTIME_DEPENDENCIES=' + JsonOutput.toJson([
                configuration: configuration.name,
                modules: modules
            ]))
        }
    }
}
